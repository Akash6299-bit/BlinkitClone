<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
</head>

<style>

    #parent{
        display: flex;
        background-color: white(248, 248, 246);
        justify-content: center;
    }


    .login-box{

        background-color: rgb(242, 246, 248);
        width: 300px;
        height: 500px;
        margin-left: 30px;
        border-radius: 10px;
        box-shadow: 0px 0px 10px;
    }
    .login-box-2{
        /* background-color: aliceblue; */
        height: 400px;
        display: flex;
        flex-direction: column;
    }

    #logo{
        background-color: rgb(219, 199, 26);
        height: 60px;;
        width: 80px;
       
        display: flex;
        justify-content: center;
        align-items: center;
        margin-left: 108px;
        border-radius: 20px;
        margin-top: 10px;
        
        
        
    }

    #logo h2{
        margin: 0;
    }

    input{
        width: 200px;
        height: 20px;
        margin-left: 20px;
        padding-left: 10px;
        border-radius: 10px;
        
    }

    button{
        width: 80px;
        height: 40px;
        margin-top: 60px;
        margin-left: 100px;

    }
</style>
<body>

<div id="parent">
    <div class="login-box">

        <div id="logo" >
             <h2 > blink<span style="color: green;">it</span></h2>
            </div>

        <H1 style="margin-left: 30px; margin-top: 30px;"> Login or Sign up </H1>

        <div class="login-box-2">
            <h3 style="margin-left: 20px;">Name: </h3>
        <input type="text" placeholder="Enter name">

        <h3 style="margin-left: 20px;">Password: </h3>
        <input type="text"  placeholder="Enter Password">

        <button > login</button>
        </div>

    </div>
</div>

    

    <script src="login.js"></script>
</body>
</html>
